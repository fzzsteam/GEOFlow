[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/geoflow-supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/geoflow-sae-service worker
directory=/var/www/html
user=www-data
priority=100
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ai-quality-front]
command=/usr/local/bin/geoflow-sae-service ai-quality-front
numprocs=2
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html
user=www-data
priority=100
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
