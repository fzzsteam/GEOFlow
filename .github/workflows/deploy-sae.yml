name: Deploy GEOFlow to SAE

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_app:
        description: Deploy the unified GEOFlow SAE application
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: geoflow-sae-${{ github.ref }}
  cancel-in-progress: false

env:
  # ACR_LOGIN_REGISTRY is reachable by the GitHub-hosted runner. When SAE
  # uses a VPC endpoint, set ACR_IMAGE_REGISTRY to that VPC image hostname.
  ACR_LOGIN_REGISTRY: ${{ vars.ACR_LOGIN_REGISTRY || 'crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com' }}
  ACR_IMAGE_REGISTRY: ${{ vars.ACR_IMAGE_REGISTRY || vars.ACR_LOGIN_REGISTRY || 'crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com' }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'fzzs' }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY || 'geoflow' }}
  SAE_REGION_ID: ${{ vars.SAE_REGION_ID || 'cn-shenzhen' }}

jobs:
  build:
    name: Build and push the unified SAE image
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, zip, pcntl, curl, fileinfo, sodium
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Prepare test environment
        run: touch .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run deployment contract test
        run: vendor/bin/phpunit --no-coverage tests/Unit/DeploymentWorkflowContractTest.php

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Run PHP test suite
        run: composer test

      - name: Run JavaScript test suite
        run: npm run test:analytics

      - name: Validate ACR configuration
        env:
          ACR_LOGIN_REGISTRY: ${{ env.ACR_LOGIN_REGISTRY }}
          ACR_IMAGE_REGISTRY: ${{ env.ACR_IMAGE_REGISTRY }}
          ACR_NAMESPACE: ${{ env.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ env.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ACR_LOGIN_REGISTRY" || -z "$ACR_IMAGE_REGISTRY" || -z "$ACR_NAMESPACE" || -z "$ACR_REPOSITORY" ]]; then
            echo "ACR registry、namespace 或 repository 配置为空，请检查工作流默认值或仓库 Variables。" >&2
            exit 1
          fi

          if [[ -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo "缺少 ACR_USERNAME 或 ACR_PASSWORD；请配置仓库 Secrets，或授权工作流读取的组织级 Secrets。" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.ACR_LOGIN_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push immutable unified SAE image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.prod
          target: sae-all
          platforms: linux/amd64
          push: true
          # ACR Personal does not accept BuildKit provenance/SBOM attestation manifests.
          provenance: false
          sbom: false
          build-args: |
            COMPOSER_PACKAGIST_MIRROR=${{ vars.COMPOSER_PACKAGIST_MIRROR }}
          tags: |
            ${{ env.ACR_LOGIN_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.ACR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=geoflow-sae-unified
          cache-to: type=gha,mode=max,scope=geoflow-sae-unified

  deploy:
    name: Deploy the unified SAE application
    needs: build
    if: ${{ needs.build.result == 'success' && (github.event_name == 'push' || inputs.deploy_app == true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Install pinned aliyun CLI
        run: |
          set -euo pipefail
          aliyun_cli_url='https://github.com/aliyun/aliyun-cli/releases/download/v3.5.1/aliyun-cli-linux-3.5.1-amd64.tgz'
          aliyun_cli_sha256='3a9a45b9c7899228074135612d2b7ebbf32abb97826d825787cb454cd3011bdc'
          curl -fsSL -o "$RUNNER_TEMP/aliyun-cli.tgz" "$aliyun_cli_url"
          echo "${aliyun_cli_sha256}  $RUNNER_TEMP/aliyun-cli.tgz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/aliyun-cli.tgz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/aliyun" /usr/local/bin/aliyun

      - name: Deploy the unified application to SAE
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_SAE_AK_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_SAE_AK_SECRET }}
          ALIBABACLOUD_REGION_ID: ${{ env.SAE_REGION_ID }}
          ACR_IMAGE_REGISTRY: ${{ env.ACR_IMAGE_REGISTRY }}
          ACR_NAMESPACE: ${{ env.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ env.ACR_REPOSITORY }}
          SAE_APP_ID: ${{ secrets.SAE_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$SAE_APP_ID" ]]; then
            echo "必须配置 SAE_APP_ID，指向唯一的 GEOFlow SAE 应用。" >&2
            exit 1
          fi
          if [[ -z "${ALIBABACLOUD_ACCESS_KEY_ID:-}" || -z "${ALIBABACLOUD_ACCESS_KEY_SECRET:-}" || -z "${ALIBABACLOUD_REGION_ID:-}" ]]; then
            echo "缺少阿里云 SAE 凭据或地域配置。" >&2
            exit 1
          fi

          app_image="${ACR_IMAGE_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPOSITORY}:${GITHUB_SHA}"
          echo "unified: 部署镜像 ${app_image}"
          aliyun sae DeployApplication \
            --AppId "$SAE_APP_ID" \
            --ImageUrl "$app_image"
